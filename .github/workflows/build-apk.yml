name: Build Wukong Live Wallpaper

on:
  workflow_dispatch:
  push:
    paths:
      - 'WukongParallaxLiveWallpaper_V1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q WukongParallaxLiveWallpaper_V1.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: WukongParallaxLiveWallpaper
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wukong-Parallax-APK
          path: WukongParallaxLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: WukongParallaxLiveWallpaper
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wukong-Parallax-APK
          path: WukongParallaxLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
